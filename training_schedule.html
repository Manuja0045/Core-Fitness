<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customize Training Schedule</title>
  <link rel="stylesheet" href="css/training_schedule.css" />
</head>
<body>
  <div class="bg-blur"></div>

  <!-- Modern Gradient Heading -->
  <h1 class="modern-title">Customize Your Weekly Training</h1>

  <div class="container">
    <!-- Form to select training schedule -->
    <div id="schedule-form" class="schedule-form"></div>
    <button class="submit-btn" onclick="submitSchedule()">Save Schedule</button>

    <!-- Display user's current schedule -->
    <h2 class="section-title">Your Schedule</h2>
    <div id="schedule-view" class="schedule-view"></div>
  </div>

  <script src="js/training_schedule.js"></script>
</body>
</html>
