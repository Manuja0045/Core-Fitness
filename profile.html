<!DOCTYPE html>

</head>
<body>

    <header>
        <h1>Welcome, <span id="user-name">User</span></h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>

            <ul>
                <li><strong>Plan:</strong> <span id="membership-type">Loading...</span></li>

                <li><strong>Attendance:</strong> <span id="attendance">Loading...</span></li>
