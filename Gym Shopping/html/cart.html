<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="../css/cart.css">
  </head>
  <body>
    <div class="container">
      <div class="cart-section">
        <h2>Shopping Cart</h2>
        <div id="cart-items"></div>
      </div>

      <div class="summary-section">
        <h2>Order Summary</h2>
        <div class="summary-details">
          <p><span>Items</span><span id="item-count">0</span></p>
          <p><span>Subtotal</span><span id="subtotal">₹0.00</span></p>
          <p><span>Shipping</span><span id="shipping-cost">₹0.00</span></p>
        </div>

        <label>Delivery Option</label>
        <select id="shipping" onchange="updateTotal()">
          <option value="0">Select Delivery Option</option>
          <option value="50">Standard Delivery - ₹50</option>
          <option value="100">Express Delivery - ₹100</option>
        </select>

        <label>Payment Method:</label>
        <select id="payment">
          <option value="none">Select Payment Method</option>
          <option value="cod">Cash on Delivery</option>
          <option value="card">Credit/Debit Card</option>
          <option value="upi">UPI</option>
        </select>

        <h3>Total: <span id="total">₹0.00</span></h3>
        <button class="checkout-btn" onclick="checkout()">CHECKOUT</button>
      </div>
    </div>

    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function renderCart() {
        const cartItemsDiv = document.getElementById("cart-items");
        cartItemsDiv.innerHTML = "";
        let subtotal = 0;

        if (cart.length === 0) {
          cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
          document.getElementById("item-count").innerText = "0";
          document.getElementById("subtotal").innerText = "₹0.00";
          updateTotal();
          return;
        }

        cart.forEach((item, index) => {
          cartItemsDiv.innerHTML += `
          <div class="cart-item">
            <img src="${item.img}" alt="${item.name}" />
            <div class="cart-details">
              <strong>${item.name}</strong><br/>
              ₹${item.price} x <span>${item.quantity || 1}</span>
              <div class="qty-control">
                <button onclick="updateQty(${index}, -1)">-</button>
                <span>${item.quantity || 1}</span>
                <button onclick="updateQty(${index}, 1)">+</button>
              </div>
              <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `;
          subtotal += item.price * (item.quantity || 1);
        });

        document.getElementById("item-count").innerText = cart.length;
        document.getElementById("subtotal").innerText = `₹${subtotal}`;
        updateTotal();
      }

      function updateQty(index, change) {
        if (!cart[index].quantity) cart[index].quantity = 1;
        cart[index].quantity += change;
        if (cart[index].quantity <= 0) cart[index].quantity = 1;
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function updateTotal() {
        const shipping =
          parseInt(document.getElementById("shipping").value) || 0;
        const subtotal = cart.reduce(
          (sum, item) => sum + item.price * (item.quantity || 1),
          0
        );

        document.getElementById("subtotal").innerText = `₹${subtotal}`;
        document.getElementById("shipping-cost").innerText = `₹${shipping}`;
        document.getElementById("total").innerText = `₹${subtotal + shipping}`;
      }

      function checkout() {
        const delivery = document.getElementById("shipping").value;
        const payment = document.getElementById("payment").value;

        if (delivery === "0" || payment === "none") {
          document.getElementById("total").innerText =
            "Please select delivery and payment";
          return;
        }

        const totalPaid =
          cart.reduce(
            (sum, item) => sum + item.price * (item.quantity || 1),
            0
          ) + parseInt(delivery);

        document.querySelector(".cart-section").innerHTML = `
        <h2>Thank you for your purchase!</h2>
        <p>Your order has been placed successfully and will be delivered at your registered address.</p>
      `;

        document.querySelector(".summary-section").innerHTML = `
        <h2>Order Summary</h2>
        <p><strong>Delivery Method:</strong> ${
          delivery == 50 ? "Standard" : "Express"
        }</p>
        <p><strong>Payment Method:</strong> ${payment.toUpperCase()}</p>
        <p><strong>Total Paid:</strong> ₹${totalPaid}</p>
        <p>We will deliver your order soon!</p>
      `;

        cart = [];
        localStorage.setItem("cart", JSON.stringify([]));
      }

      // Call renderCart when the page loads
      renderCart();
    </script>
  </body>
</html>
